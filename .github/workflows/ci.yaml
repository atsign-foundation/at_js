name: ci

on:
  push:
    branches: [trunk, 'st/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/trunk') }}

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare
        run: npm run ci:prepare --workspaces --if-present
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      - name: Lint
        run: npm run lint --workspaces --if-present
      - name: Test
        run: npm run test --workspaces --if-present
      - name: Build
        run: npm run build --workspaces --if-present
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run e2e --workspaces --if-present
      - name: Pack check
        run: npm run pack:check --workspaces --if-present
      - name: Scenario check
        run: |
          missing="$(features/check_scenarios.sh)"
          if [ -n "$missing" ]; then
            printf '%s\n' "$missing"
            exit 1
          fi
