name: node-bump

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Find newer patch
        id: next
        shell: bash
        run: |
          version="$(node tools/node_bump/src/main.ts)"
          [[ -z "$version" || "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version output" >&2; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Open bump pull request
        if: steps.next.outputs.version != ''
        run: bash tools/node_bump/open_pr.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
          VERSION: ${{ steps.next.outputs.version }}
